[build]
  publish = "."

# Canonical host is the apex domain.
[[redirects]]
  from = "https://www.medadx.com/*"
  to = "https://medadx.com/:splat"
  status = 301
  force = true

# Keep internal docs off the public site.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/recipes"
  to = "/recipes.html"
  status = 200

[[redirects]]
  from = "/history-of-rice"
  to = "/history-of-rice.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
